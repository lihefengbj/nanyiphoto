name: Python 3.14 checks and release build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.14.5 / Node checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Verify pinned Python interpreter
        run: python -c "from pathlib import Path; import platform; assert platform.python_version() == Path('.python-version').read_text().strip()"
      - run: npm run miniprogram:sync
      - run: npm run check
      - run: npm test
      - run: npm run poc:check
      - run: python -m pip install -r backend/requirements.lock
      - name: Install optional ONNX CPU test runtime
        run: |
          python -m pip install --only-binary=:all: -r backend/requirements-model.lock
      - name: Require real ONNX Runtime CPU provider for graph tests
        run: python -c "import onnxruntime as ort; assert 'CPUExecutionProvider' in ort.get_available_providers()"
      - run: python -m pip install --no-deps --no-build-isolation -e backend
      - run: python -m pip check
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest backend/tests
      - run: npm run smoke:api
      - run: git diff --exit-code -- miniprogram/data/specs.js
      - name: Build backend wheel and mini program source bundle
        run: |
          mkdir -p dist
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./backend
          git archive --format=zip --output=dist/nanyiphoto-miniprogram.zip HEAD miniprogram project.config.json config/specs.example.json README.md docs .node-version .python-version
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanyiphoto-build-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
